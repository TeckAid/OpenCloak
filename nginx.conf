# Cloaking SaaS - Nginx Configuration
# Add this to your nginx server block.
#
# MULTI-DOMAIN: every custom domain you add in the admin panel (Domains page)
# must reach this server. Two options:
#
#  A) If all your domains are subdomains of one zone you control, use a
#     wildcard server_name + wildcard TLS (e.g. Caddy/Traefik handle this
#     automatically, or certbot --nginx with a wildcard DNS-01 cert):
#
#        server_name *.yourdomain.com;
#
#  B) For arbitrary domains (s.example.com, go.other.com), add one server
#     block per domain that reuses the config below. Caddy or Traefik with
#     auto-TLS is the least-effort option; the app matches links to the
#     domain by HTTP_HOST, no per-domain code needed.

server {
    listen 80;
    server_name yourdomain.com;
    root /path/to/Cloaking;
    index index.php;

    # Enable gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    add_header X-Content-Type-Options "nosniff" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        try_files /healthz =404;
    }

    # Deny sensitive paths and operational artifacts.
    location ~* ^/(?:config(?:\.local(?:\.example)?)?\.php|install\.php|dev-router\.php|Dockerfile|docker-compose\.yml|nginx\.conf|\.dockerignore|README\.md|CODE_REVIEW\.md|IMPLEMENTATION_PLAN\.md)$ { return 404; }
    location ~* ^/(?:data|logs|includes|docs|docker|tests|\.git|\.github|\.superpowers)(?:/|$) { deny all; }
    location ~* \.(?:sqlite(?:-(?:wal|shm|journal))?|sqlite3|db3?|sql|log)$ { deny all; }
    location ~ /\. { deny all; }

    location = /admin {
        return 301 /admin/;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.php?$query_string;
    }

    location /api/ {
        try_files $uri /api/index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass 127.0.0.1:9000;
    }

    location = /api/index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~ ^/admin/[A-Za-z0-9_-]+\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~ \.php$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
