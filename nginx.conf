# Cloaking SaaS - Nginx Configuration
# Add this to your nginx server block.
#
# MULTI-DOMAIN: every custom domain you add in the admin panel (Domains page)
# must reach this server. Two options:
#
#  A) If all your domains are subdomains of one zone you control, use a
#     wildcard server_name + wildcard TLS (e.g. Caddy/Traefik handle this
#     automatically, or certbot --nginx with a wildcard DNS-01 cert):
#
#        server_name *.yourdomain.com;
#
#  B) For arbitrary domains (s.example.com, go.other.com), add one server
#     block per domain that reuses the config below. Caddy or Traefik with
#     auto-TLS is the least-effort option; the app matches links to the
#     domain by HTTP_HOST, no per-domain code needed.

server {
    listen 80;
    server_name yourdomain.com;
    root /path/to/Cloaking;
    index index.php;

    # Enable gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Deny sensitive paths
    location ~ ^/(config\.php|config\.local\.php|config\.local\.example\.php|install\.php|dev-router\.php)$ { deny all; }
    location ~ ^/(includes|data|logs)(/|$) { deny all; }
    location ~ /\. { deny all; }

    # Admin panel (^~ so the slug regex below can never match it)
    location ^~ /admin {
        try_files $uri $uri/ /admin/index.php?$args;
    }

    # API
    location ^~ /api {
        try_files $uri $uri/ /api/index.php?$args;
    }

    # Static assets
    location ^~ /assets {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Cloaked links - single segment slugs only (admin/api/assets are ^~ and win)
    location ~ ^/[a-zA-Z0-9_-]+/?$ {
        try_files $uri $uri/ /index.php?$args;
    }

    # PHP handling
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
