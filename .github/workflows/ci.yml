name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Lint PHP files
        run: |
          set -e
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(git ls-files '*.php' | tr '\n' '\0')

      - name: Run tests
        run: php tests/run.php

      - name: Verify pinned production image references
        run: |
          chmod +x tests/Integration/check_pinned_images.sh
          tests/Integration/check_pinned_images.sh

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build production image from clean context
        run: docker build --pull --file Dockerfile --tag cloaking:${{ github.sha }} .

      - name: Run Apache integration checks
        run: tests/Integration/web_server_test.sh apache

      - name: Run Nginx integration checks
        run: tests/Integration/web_server_test.sh nginx

      - name: Run Caddy integration checks
        run: tests/Integration/web_server_test.sh caddy
