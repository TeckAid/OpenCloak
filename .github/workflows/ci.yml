name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Lint PHP files
        run: |
          set -e
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(git ls-files '*.php' | tr '\n' '\0')

      - name: Run tests
        run: php tests/run.php
