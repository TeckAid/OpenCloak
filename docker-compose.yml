services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Refresh with: docker buildx imagetools inspect php:8.4-apache-bookworm
        PHP_APACHE_IMAGE: docker.io/library/php:8.4-apache-bookworm@sha256:25d70665acee86d7231af7bc5464794abd14585f80210f85f22dfb0713ac8ec7
    expose:
      - "80"
    volumes:
      - type: bind
        source: ./data
        target: /var/www/html/data
      - type: bind
        source: ./logs
        target: /var/www/html/logs
      - type: bind
        source: ${CLOAKING_CONFIG_PATH:-./docker/config.local.php}
        target: /var/www/html/config.local.php
        read_only: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/apache2
      - /var/lock/apache2
    networks:
      app:
        ipv4_address: 172.23.0.10
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    pids_limit: 128
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  edge:
    # Refresh with: docker buildx imagetools inspect caddy:2.10-alpine
    image: docker.io/library/caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${CLOAKING_HTTP_PORT:-80}:80"
      - "${CLOAKING_HTTPS_PORT:-443}:443"
    volumes:
      - type: bind
        source: ./docker/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - type: volume
        source: caddy_data
        target: /data
      - type: volume
        source: caddy_config
        target: /config
    restart: unless-stopped
    networks:
      app:
        ipv4_address: 172.23.0.2
      edge:
        ipv4_address: 172.24.0.2
    pids_limit: 128
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app:
    internal: true
    ipam:
      config:
        - subnet: 172.23.0.0/24
  edge:
    ipam:
      config:
        - subnet: 172.24.0.0/24

volumes:
  caddy_data:
  caddy_config:
